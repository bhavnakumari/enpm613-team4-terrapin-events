<html>
  <body style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
      <div style="text-align:center; margin-bottom:24px;">
      <img
        src="cid:eventlogo"
        alt="University of Maryland"
        style="max-width: 100%; height: auto;"
      />
    </div>
      <h2>We'd love your feedback on {{event_title}}</h2>

    <p>
      Thanks for attending <strong>{{event_title}}</strong>.<br />
      Date &amp; time: {{event_datetime}}<br />
      Location: {{event_location}}
    </p>

    <p>Please click the link below to share your feedback:</p>

    <p>
      <a
        href="{{feedback_url}}"
        style="background:#E21833;color:#fff;padding:10px 18px;border-radius:4px;text-decoration:none;"
      >
        Give Feedback
      </a>
    </p>

    <p style="margin-top:24px;font-size:13px;color:#666;">
      If the button doesn't work, copy and paste this URL into your browser:<br />
      {{feedback_url}}
    </p>
  </body>
</html>

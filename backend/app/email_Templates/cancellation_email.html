<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; font-family:Arial, sans-serif;">

<!-- MAIN CONTAINER -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0">

        <!-- BIG HEADER IMAGE -->
        <tr>
          <td>
            <img
              src="cid:eventlogo"
              alt="Event Header"
              style="display:block; width:100%; max-width:600px; height:auto;"
            />
          </td>
        </tr>

        <!-- BODY -->
        <tr>
          <td style="padding:20px; color:#000000;">

            <h2 style="margin-top:0;">Your registration has been cancelled</h2>

            <p>You have successfully cancelled your registration for:</p>

            <h3 style="margin:0 0 10px 0;">{{event_title}}</h3>

            <p>
              <strong>Date & Time:</strong> {{event_datetime}}<br/>
              <strong>Location:</strong> {{event_location}}
            </p>

            <p style="margin-top:30px;">
              If you did not initiate this cancellation, please contact the organizers immediately.
            </p>

            <p style="margin-top:30px;">
              Best regards,<br/>
              Terrapin Events
            </p>

          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>

</body>
</html>

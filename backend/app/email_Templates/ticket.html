<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Terrapin Events Ticket</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }
    .container {
      max-width: 600px;
      margin: 30px auto;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      overflow: hidden;
    }
    .header {
      background-color: #800000;
      color: #ffffff;
      padding: 16px 24px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      font-size: 22px;
    }
    .content {
      padding: 20px 24px 24px 24px;
      color: #333333;
    }
    .content h2 {
      margin-top: 0;
    }
    .details {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.6;
    }
    .details dt {
      font-weight: bold;
    }
    .details dd {
      margin: 0 0 8px 0;
    }
    .qr-section {
      text-align: center;
      padding: 20px 0;
    }
    .qr-section img {
      width: 180px;
      height: 180px;
    }
    .footer {
      font-size: 12px;
      color: #777777;
      text-align: center;
      padding: 12px 16px 16px 16px;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <h1>Terrapin Events – Event Ticket</h1>
    </div>

    <div class="content">
      <h2>{{event_title}}</h2>

      <dl class="details">
        <dt>Date &amp; Time</dt>
        <dd>{{event_datetime}}</dd>

        <dt>Location</dt>
        <dd>{{event_location}}</dd>

        <dt>Attendee</dt>
        <dd>{{user_email}}</dd>

        <dt>Registration ID</dt>
        <dd>{{registration_id}}</dd>
      </dl>

      <div class="qr-section">
        <p>Show this QR code at the event check-in:</p>
        <img src="data:image/png;base64,{{qr_image_data}}" alt="Ticket QR Code" />
      </div>
    </div>

    <div class="footer">
      This ticket is valid only for the registered attendee. Please keep it safe.
    </div>
  </div>
</body>
</html>

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: terrapin-events-backend-hpa
  namespace: terrapin-events
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: terrapin-events-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

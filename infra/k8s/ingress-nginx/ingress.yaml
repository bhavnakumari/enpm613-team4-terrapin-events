apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: terrapin-ingress
  namespace: terrapin-events
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - logicinloop.com
      secretName: terrapin-tls
  rules:
    - host: logicinloop.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: terrapin-events-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: terrapin-events-frontend
                port:
                  number: 80
